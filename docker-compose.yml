services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: perpustakaan_app
    ports:
      # Mengubah port host ke 8080 karena port 5000 sudah digunakan di server Anda
      - "8080:5000"
    environment:
      # Mengarahkan database SQLite ke folder /data yang di-mount sebagai volume persisten
      - DATABASE_URL=sqlite:////app/data/perpustakaan.db
      - FLASK_DEBUG=False
      - SECRET_KEY=kunci-rahasia-perpustakaan-ganti-saat-produksi
    volumes:
      # Mount folder data untuk database agar tidak hilang saat container direstart/rebuild
      - ./data:/app/data
      # Mount folder uploads untuk cover buku & logo sekolah
      - ./static/uploads:/app/static/uploads
    restart: unless-stopped
