<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ buku.judul }} - E-Book</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.0/font/bootstrap-icons.css" rel="stylesheet">
    <style>
        * { box-sizing: border-box; }
        html, body { width: 100%; height: 100%; margin: 0; }
        body { display: flex; flex-direction: column; background: #e9efec; color: #18332b; font-family: 'DM Sans', sans-serif; }
        .reader-toolbar { min-height: 64px; display: flex; align-items: center; gap: 16px; padding: 10px 20px; background: #173d33; color: #fff; }
        .reader-back { color: #fff; text-decoration: none; white-space: nowrap; }
        .reader-title { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 600; }
        .reader-action { color: #fff; border: 1px solid rgba(255,255,255,.5); text-decoration: none; padding: 7px 10px; border-radius: 4px; white-space: nowrap; }
        .reader-action:hover { color: #fff; background: rgba(255,255,255,.12); }
        .reader-frame { flex: 1; min-height: 0; width: 100%; border: 0; background: #dfe5e2; }
        @media (max-width: 520px) { .reader-toolbar { gap: 8px; padding: 8px 10px; } .reader-title { font-size: 13px; } .reader-action { padding: 7px 8px; font-size: 13px; } }
        @media print { .reader-toolbar { display: none; } .reader-frame { height: 100vh; } }
    </style>
</head>
<body>
    <header class="reader-toolbar">
        <a class="reader-back" href="/opac" aria-label="Kembali ke katalog"><i class="bi bi-arrow-left"></i></a>
        <div class="reader-title" title="{{ buku.judul }}">{{ buku.judul }}</div>
        <a class="reader-action" href="{{ url_for('serve_ebook_pdf', id=buku.id) }}" target="_blank" rel="noopener" aria-label="Buka PDF di tab baru"><i class="bi bi-box-arrow-up-right"></i></a>
        <a class="reader-action" href="{{ url_for('serve_ebook_pdf', id=buku.id) }}" download aria-label="Unduh e-book"><i class="bi bi-download"></i></a>
    </header>
    <iframe class="reader-frame" src="{{ url_for('serve_ebook_pdf', id=buku.id) }}" title="Pembaca PDF: {{ buku.judul }}"></iframe>
</body>
</html>
